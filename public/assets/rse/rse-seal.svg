<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 120" width="400" height="120" fill="none">
  <!-- Background transparent -->
  <g transform="translate(10, 10)">
    <!-- Heraldic Astrolabe / Armillary Compass Emblem -->
    <circle cx="50" cy="50" r="46" stroke="#4f3622" stroke-width="2" fill="#1c130c" />
    <circle cx="50" cy="50" r="42" stroke="#987f61" stroke-width="1" stroke-dasharray="3 3" />
    <circle cx="50" cy="50" r="34" stroke="#fee197" stroke-width="1.5" />
    
    <!-- Coordinate Cross & Meridian Rings -->
    <ellipse cx="50" cy="50" rx="34" ry="14" stroke="#c9a86a" stroke-width="1" transform="rotate(-25 50 50)" />
    <ellipse cx="50" cy="50" rx="34" ry="14" stroke="#c9a86a" stroke-width="1" transform="rotate(35 50 50)" />
    <line x1="50" y1="12" x2="50" y2="88" stroke="#fee197" stroke-width="1.5" />
    <line x1="12" y1="50" x2="88" y2="50" stroke="#fee197" stroke-width="1.5" />
    
    <!-- Central Star of Statecraft -->
    <polygon points="50,40 53,47 60,50 53,53 50,60 47,53 40,50 47,47" fill="#fee197" />
    <circle cx="50" cy="50" r="3" fill="#b8755b" />
    
    <!-- Text Elements -->
    <text x="115" y="38" font-family="Georgia, 'Times New Roman', serif" font-size="24" font-weight="bold" fill="#fff8e9" letter-spacing="2">
      R S E
    </text>
    <text x="180" y="38" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="600" fill="#fee197" letter-spacing="3">
      // 1494
    </text>
    
    <text x="115" y="58" font-family="Georgia, 'Times New Roman', serif" font-size="13" font-style="italic" fill="#ffebd0" letter-spacing="1">
      Renaissance Stability Engine
    </text>
    
    <text x="115" y="78" font-family="'JetBrains Mono', monospace" font-size="9.5" fill="#987f61" letter-spacing="1.5">
      HISTORICAL POLITICAL RISK &amp; EQUILIBRIUM
    </text>
    
    <line x1="115" y1="88" x2="360" y2="88" stroke="#4f3622" stroke-width="1" />
  </g>
</svg>
